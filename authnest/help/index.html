body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif; background:var(--bg); color:var(--fg); line-height:1.65; }

<h1>帮助与支持</h1>
<p class="muted">用于商店上架的支持页</p>
<p>如需账号、订阅、备份或隐私相关协助，请在 AuthNest 应用内打开「帮助与反馈」联系我们。</p>
<p><strong>请勿</strong>在反馈中提交 TOTP Secret、一次性口令（OTP）、PIN 或明文密码。</p>
<ul>
<li>换机后如何恢复：登录同一账号并开启云备份恢复流程。</li>
<li>订阅问题：通过 Google Play / App Store 的订阅管理与「恢复购买」处理。</li>
<li>删除账号：在应用内账号设置按提示操作。</li>
</ul>

</article></main>
<footer>© AuthNest · bytesprite</footer>
